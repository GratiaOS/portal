name: Container

# The image is built, and asked for its health, whenever what makes it changes; a tag `v*` also publishes it.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - container/**
      - scripts/container-smoke.sh
      - .github/workflows/container.yml
  push:
    tags: ['v*']

permissions: {}

jobs:
  image:
    name: Build the image, open the portal in it
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # used only by the last step, on a tag
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build it and ask it for its health
        env:
          EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          # a tag `v0.3.1` must find 0.3.1 in the image
          EXPECT_VERSION="${EXPECT_VERSION#v}" scripts/container-smoke.sh portal:smoke

      - name: Publish it (a tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag portal:smoke "$IMAGE:${TAG#v}"
          docker tag portal:smoke "$IMAGE:latest"
          docker push "$IMAGE:${TAG#v}"
          docker push "$IMAGE:latest"
